name: ai_digital_library
description: "AI Digital Library - Multi-Platform Flutter Client (Windows, Android, iOS)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & REST API
  dio: ^5.4.0

  # State Management
  provider: ^6.1.1

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI & Styling
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

  # Media, File Picking & Markdown Rendering
  file_picker: ^8.1.7
  flutter_markdown: ^0.7.4
  audioplayers: ^6.1.0
  record: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

